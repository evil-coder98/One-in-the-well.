<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>One in the Well — Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div id="title">ONE IN THE WELL.</div>
    <div id="bar-counter">BAR 0</div>
    <div id="hint">Drag to look. Tap a bar to grab it.</div>
    <div id="status"></div>
  </div>

  <div id="start-screen" class="screen">
    <div class="panel">
      <h1>ONE IN THE WELL.</h1>
      <p>You cannot walk.</p>
      <p>Climb.</p>
      <button id="start-button">START</button>
      <small>Prototype build</small>
    </div>
  </div>

  <div id="death-screen" class="screen hidden">
    <div class="panel">
      <h1>YOU FELL.</h1>
      <p id="death-reason"></p>
      <button id="restart-button">CLIMB AGAIN</button>
    </div>
  </div>

  <div id="message"></div>

  <script type="module" src="game.js"></script>
</body>
</html>
