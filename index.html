<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>LEGS</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app"><canvas id="game"></canvas>
<section id="menu" class="screen"><div class="title">LEGS</div><p class="subtitle">DON'T LET IT GET BEHIND YOU.</p><div class="modes"><button data-mode="steals" class="mode"><b>IT STEALS</b><small>FLASHLIGHT · STALKING</small></button><button data-mode="shutter" class="mode"><b>SHUTTER</b><small>CAMERA · LIMITED USES</small></button><button class="mode locked" type="button" data-mode="inactive"><b>MODE 3</b><small>COMING SOON</small></button><button class="mode locked" type="button" data-mode="inactive"><b>MODE 4</b><small>COMING SOON</small></button><button class="mode locked" type="button" data-mode="inactive"><b>MODE 5</b><small>COMING SOON</small></button><button class="mode locked" type="button" data-mode="inactive"><b>MODE 6</b><small>COMING SOON</small></button><button class="mode locked" type="button" data-mode="inactive"><b>MODE 7</b><small>COMING SOON</small></button></div><p class="help">WASD / ARROWS to move · SHIFT to run · drag to look<br>On touch: left pad to move, drag right side to look</p></section>
